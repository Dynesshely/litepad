<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#4338ca" media="(prefers-color-scheme: dark)" />
    <!-- 站点图标：SVG 优先，ICO/PNG 回退，另有 iOS 图标与站点清单 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Litepad · 自动保存</title>
    <script>
      // 在应用挂载前恢复主题/壁纸偏好，避免深浅色与半透明表面的闪烁（FOUC）
      ;(function () {
        try {
          var p = JSON.parse(localStorage.getItem('dsh.scratch.v1.ui') || 'null')
          var dark =
            p && typeof p.dark === 'boolean'
              ? p.dark
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var root = document.documentElement
          if (dark) root.classList.add('dark')
          // 图片本体在 IndexedDB 里是异步读回来的，先用同步标记把根背景切透明，避免先闪一层不透明底色
          if (p && p.hasBg === true) root.classList.add('has-bg')
        } catch (e) {
          /* 忽略 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
