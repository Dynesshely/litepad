<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="临时草稿本">
  <title>临时草稿本</title>
  <desc>靛蓝渐变底板上的便签纸与铅笔，右上角绿点为自动保存状态</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="url(#bg)"/>

  <!-- 便签纸 -->
  <rect x="5.6" y="5.6" width="12" height="18" rx="2.2" fill="#ffffff"/>
  <rect x="16.5" y="6.6" width="1.1" height="16" rx="0.55" fill="#e0e7ff"/>

  <!-- 文本行（2 条加粗，保证 16px 下仍可辨认） -->
  <rect x="8.2" y="10.8" width="7.4" height="2.6" rx="1.3" fill="#818cf8"/>
  <rect x="8.2" y="15.6" width="5.4" height="2.6" rx="1.3" fill="#818cf8"/>

  <!-- 铅笔（右下角斜向书写，不压到文字行） -->
  <g transform="rotate(-45 21.7 21.7)">
    <rect x="20.2" y="13.7" width="3" height="10" rx="0.7" fill="#fbbf24"/>
    <rect x="20.2" y="22.9" width="3" height="1.2" fill="#e5e7eb"/>
    <polygon points="20.2,24.1 23.2,24.1 21.7,26.7" fill="#f59e0b"/>
    <polygon points="21,25.6 22.4,25.6 21.7,26.7" fill="#1f2937"/>
  </g>

  <!-- 自动保存状态点（与状态栏的保存状态圆点一致） -->
  <circle cx="25.4" cy="6.4" r="3.2" fill="#22c55e" stroke="#ffffff" stroke-width="1.2"/>
</svg>
